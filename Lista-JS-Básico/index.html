<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Exercícios - JavaScript</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #f4f7f6;
        }

        /* Menu Lateral */
        nav {
            width: 280px;
            background-color: #2c3e50;
            color: white;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 100vh;
            overflow-y: auto;
        }

        nav h2 {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            color: #ecf0f1;
        }

        .btn-nav {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 10px 12px;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            line-height: 1.3;
        }

        .btn-nav:hover, .btn-nav.ativo {
            background-color: #3498db;
        }

        /* Área de Conteúdo */
        main {
            flex: 1;
            padding: 40px;
            max-width: 800px;
        }

        /* Cartões de Exercícios */
        .card-questao {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: none;
        }

        .card-questao.ativa {
            display: block;
        }

        .card-questao h1 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        /* Formatação Geral dos Formulários */
        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }

        button.btn-acao {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button.btn-acao:hover {
            background-color: #219150;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <nav>
        <h2>Exercícios</h2>
        <button class="btn-nav ativo" onclick="mostrarQuestao('q1', this)">Q1 - Desempenho Acadêmico</button>
        <button class="btn-nav" onclick="mostrarQuestao('q2', this)">Q2 - Verificação de Idade</button>
        <button class="btn-nav" onclick="mostrarQuestao('q3', this)">Q3 - Monitoramento de Temperatura</button>
        <button class="btn-nav" onclick="mostrarQuestao('q4', this)">Q4 - Cálculo de Desconto</button>
        <button class="btn-nav" onclick="mostrarQuestao('q5', this)">Q5 - Situação Final do Estudante</button>
        <button class="btn-nav" onclick="mostrarQuestao('q6', this)">Q6 - Controle de Acesso</button>
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    </nav>

    <!-- Área Principal -->
    <main id="conteudo-principal">

        <!-- QUESTÃO 01 -->
        <section id="q1" class="card-questao ativa">
            <h1>Questão 01 - Desempenho Acadêmico</h1>
            
            <div class="campo">
                <label for="nota1">Primeira Nota (0 a 10):</label>
                <input id="nota1" type="number" step="0.1" min="0" max="10" placeholder="Ex: 8.5">
            </div>

            <div class="campo">
                <label for="nota2">Segunda Nota (0 a 10):</label>
                <input id="nota2" type="number" step="0.1" min="0" max="10" placeholder="Ex: 7.0">
            </div>

            <button id="btnCalcular" class="btn-acao">Calcular Média</button>

            <p id="resultado" class="resultado"></p>
        </section>

        <!-- QUESTÃO 02 -->
        <section id="q2" class="card-questao">
            <h1>Questão 02 - Verificação de Idade</h1>
            
            <div class="campo">
                <label for="idade">Idade (0 a 120 anos):</label>
                <input id="idade" type="number" min="0" max="120" placeholder="Ex: 25">
            </div>

            <button id="verificar" class="btn-acao">Verificar Idade</button>

            <p id="mensagem" class="resultado"></p>
        </section>
        
        <!-- QUESTÃO 03 -->
        <section id="q3" class="card-questao">
            <h1>Questão 03 - Monitoramento de Temperatura</h1>
            
            <div class="campo">
                <label for="temperatura">Temperatura Atual (°C):</label>
                <input id="temperatura" type="number" placeholder="Ex: 28">
            </div>

            <button id="analisar" class="btn-acao">Analisar Temperatura</button>

            <div id="alerta" class="resultado"></div>
        </section>

        <!-- QUESTÃO 04 -->
        <section id="q4" class="card-questao">
            <h1>Questão 04 - Cálculo de Desconto</h1>
            
            <div class="campo">
                <label for="valorCompra">Valor da Compra (R$):</label>
                <input id="valorCompra" type="number" step="0.01" placeholder="Ex: 250.00">
            </div>

            <button id="calcular" class="btn-acao">Calcular Desconto</button>

            <p id="resultado" class="resultado"></p>
        </section>

        <!-- QUESTÃO 05 -->
        <section id="q5" class="card-questao">
            <h1>Questão 05 - Situação Final do Estudante</h1>
            
            <div class="campo">
                <label for="media">Média do Estudante (0 a 10):</label>
                <input id="media" type="number" step="0.1" min="0" max="10" placeholder="Ex: 7.5">
            </div>

            <button id="verificar" class="btn-acao">Verificar Situação</button>

            <h3 id="situacao" class="resultado"></h3>
        </section>

        <!-- QUESTÃO 06 -->
        <section id="q6" class="card-questao">
            <h1>Questão 06 - Controle de Acesso</h1>
            
            <div class="campo">
                <label for="nome">Nome do Funcionário:</label>
                <input id="nome" type="text" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="idade">Idade (0 a 120 anos):</label>
                <input id="idade" type="number" min="0" max="120" placeholder="Digite sua idade">
            </div>

            <button id="acessar" class="btn-acao">Verificar Acesso</button>

            <p id="resultado" class="resultado"></p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
