<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            max-width: 400px;
            margin: 40px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 22px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .opcoes-genero {
            display: flex;
            gap: 15px;
        }

        .opcoes-genero label {
            font-weight: normal;
            cursor: pointer;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Calculadora de IMC</h1>

    <div class="campo">
        <label>Gênero:</label>
        <div class="opcoes-genero">
            <label><input type="radio" id="homem" name="genero" value="homem" checked> Homem</label>
            <label><input type="radio" id="mulher" name="genero" value="mulher"> Mulher</label>
        </div>
    </div>

    <div class="campo">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 70.5">
    </div>

    <div class="campo">
        <label for="altura">Altura (metros):</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
    </div>

    <button type="button" onclick="calcularIMC()">Calcular IMC</button>

    <div id="resultado">Preencha os campos e clique em calcular.</div>

    <script src="js01.js"></script>
</body>
</html>
