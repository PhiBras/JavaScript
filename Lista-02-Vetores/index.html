<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Exercícios JS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #f4f6f9;
      color: #333;
    }

    /* Sidebar - Menu Lateral */
    .sidebar {
      width: 320px;
      background-color: #1e293b;
      color: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
    }

    .sidebar h2 {
      padding: 20px;
      font-size: 1.2rem;
      border-bottom: 1px solid #334155;
      background-color: #0f172a;
    }

    .sidebar ul {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .sidebar li {
      padding: 15px 20px;
      border-bottom: 1px solid #334155;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-size: 0.95rem;
    }

    .sidebar li:hover {
      background-color: #334155;
    }

    .sidebar li.active {
      background-color: #2563eb;
      color: #fff;
      font-weight: bold;
    }

    /* Área Principal */
    .content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      max-width: 900px;
      margin: 0 auto;
    }

    .card h1 {
      font-size: 1.6rem;
      color: #1e293b;
      margin-bottom: 10px;
    }

    .card p.description {
      color: #64748b;
      font-size: 1rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .output-box {
      background-color: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 25px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      color: #0f172a;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    pre {
      background-color: #0f172a;
      color: #38bdf8;
      padding: 20px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-group input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 1rem;
      width: 100px;
    }
  </style>
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <h2>Exercícios de JS</h2>
    <ul id="menu-exercicios"></ul>
  </aside>

  <!-- Painel Principal -->
  <main class="content">
    <div class="card">
      <h1 id="ex-titulo">Selecione um Exercício</h1>
      <p class="description" id="ex-descricao">Clique em uma das opções no menu à esquerda para visualizar a execução e o código.</p>

      <div id="interactive-area"></div>

      <div class="section-title">Resultado Executado na Tela:</div>
      <div class="output-box" id="ex-resultado">O resultado aparecerá aqui...</div>

      <div class="section-title">Código JavaScript Utilizado:</div>
      <pre><code id="ex-codigo">// Selecione um exercício para visualizar o código</code></pre>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
